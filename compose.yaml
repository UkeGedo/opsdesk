services:
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/opsdesk.db
      ATTACHMENT_DIR: /data/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-5242880}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      MAIL_MODE: ${MAIL_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - opsdesk-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: web
    ports:
      - '127.0.0.1:8080:8080'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  opsdesk-data:
